<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal RAG System</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar / Upload Area -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><i class="fa-solid fa-brain"></i> AI File Manager</h2>
                <p>Upload your knowledge base</p>
            </div>
            
            <div class="upload-container">
                <div class="upload-area" id="drop-zone">
                    <i class="fa-solid fa-cloud-arrow-up upload-icon"></i>
                    <p>Drag & Drop files here</p>
                    <span>or</span>
                    <label for="file-input" class="custom-file-upload">
                        Browse Files
                    </label>
                    <input type="file" id="file-input" accept=".pdf,.txt" />
                </div>
                <div id="upload-status" class="status-message"></div>
            </div>
            
            <div class="system-info">
                <h3>System Status</h3>
                <ul>
                    <li><i class="fa-solid fa-circle-check" style="color: #10b981;"></i> Backend API</li>
                    <li><i class="fa-solid fa-database" style="color: #3b82f6;"></i> ChromaDB</li>
                    <li><i class="fa-solid fa-microchip" style="color: #8b5cf6;"></i> LM Studio (Port 1234)</li>
                </ul>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-container">
            <header class="chat-header">
                <h2>Knowledge Chat</h2>
                <div class="status-indicator">
                    <span class="dot"></span> Online
                </div>
            </header>
            
            <div class="chat-box" id="chat-box">
                <div class="message ai-message">
                    <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                    <div class="message-content">
                        Xin chào! Tôi có thể trả lời các câu hỏi dựa trên tài liệu bạn đã tải lên. Hãy hỏi tôi bất cứ điều gì!
                    </div>
                </div>
                <!-- Messages will appear here -->
            </div>
            
            <div class="chat-input-area">
                <form id="chat-form">
                    <textarea id="chat-input" placeholder="Nhập câu hỏi tại đây..." rows="1"></textarea>
                    <button type="submit" id="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
                </form>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
